name: Feature request
description: Suggest a focused improvement to dlME
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What task is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe what the user should be able to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request does not depend on bypassing DRM or access controls.
          required: true
