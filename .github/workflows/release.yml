name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful FFmpeg source-audit workflow run ID
        required: true
        default: '34488165224'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run fetch:runtimes
      - name: Prepare matching corresponding-source core
        shell: pwsh
        run: ./scripts/build-corresponding-source.ps1 -SourceAuditRunId '${{ inputs.source_run_id }}'
      - run: npm run package:win
      - name: Enforce binary licensing gate
        run: npm run release:check
        env:
          DLME_BINARY_RELEASE: '1'
      - name: Generate checksums
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          Get-ChildItem "release/$version" -File | Where-Object Extension -in '.exe','.blockmap' | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash *$($_.Name)"
          } | Set-Content -Encoding ascii "release/$version/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: dlME-${{ steps.package.outputs.version }}-windows-unsigned
          path: |
            release/${{ steps.package.outputs.version }}/*.exe
            release/${{ steps.package.outputs.version }}/*.blockmap
            release/${{ steps.package.outputs.version }}/SHA256SUMS.txt
          if-no-files-found: error
