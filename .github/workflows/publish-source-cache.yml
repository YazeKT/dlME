name: Publish corresponding-source dependency cache

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful FFmpeg source-audit workflow run ID
        required: true
        default: '34488165224'
      release_version:
        description: dlME release version without the v prefix
        required: true
        default: '1.0.0'
      source_release_tag:
        description: Published release containing the identical pinned FFmpeg source cache (use when audit artifact expired)
        required: false
        default: 'v1.0.0'

permissions:
  actions: read
  contents: write

jobs:
  publish-source-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download the audited dependency-source artifact
        if: inputs.source_release_tag == ''
        uses: actions/download-artifact@v5
        with:
          name: ffmpeg-dependency-sources-2026-08-31
          path: audited-source
          repository: YazeKT/dlME
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare release-sized source parts
        if: inputs.source_release_tag == ''
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          test -s audited-source/ffmpeg-dependency-sources.tar
          test -s audited-source/ffmpeg-dependency-source-checksums.txt
          mkdir release-source
          cp audited-source/ffmpeg-dependency-source-checksums.txt "release-source/dlME-${RELEASE_VERSION}-ffmpeg-source-archive-checksums.txt"
          split -b 1800m -d -a 2 audited-source/ffmpeg-dependency-sources.tar "release-source/dlME-${RELEASE_VERSION}-corresponding-source-ffmpeg.tar.part-"
          sha256sum release-source/* > "release-source/dlME-${RELEASE_VERSION}-corresponding-source-part-checksums.txt"
          cat > "release-source/dlME-${RELEASE_VERSION}-corresponding-source-README.txt" <<EOF
          dlME ${RELEASE_VERSION} corresponding source: FFmpeg dependency cache

          Download every .tar.part-* file, then reconstruct the source archive:
            Linux/macOS: cat dlME-${RELEASE_VERSION}-corresponding-source-ffmpeg.tar.part-* > ffmpeg-dependency-sources.tar
            PowerShell:  Get-Content dlME-${RELEASE_VERSION}-corresponding-source-ffmpeg.tar.part-* -AsByteStream | Set-Content ffmpeg-dependency-sources.tar -AsByteStream

          Verify each downloaded part with dlME-${RELEASE_VERSION}-corresponding-source-part-checksums.txt.
          The reconstructed tar contains the full source cache generated by download.sh from
          yt-dlp/FFmpeg-Builds commit ea2ec3c0e0dfb11069729b7df5cb234bb2145956.
          EOF
      - name: Recover the checksum-pinned cache from a published release
        if: inputs.source_release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TAG: ${{ inputs.source_release_tag }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          mkdir recovered release-source
          gh release download "$SOURCE_TAG" --repo YazeKT/dlME --dir recovered --pattern '*ffmpeg.tar.part-*' --pattern '*ffmpeg-source-archive-checksums.txt'
          printf '%s  %s\n' '906bd3921a37a7c9dbdf037d3d404d7684303e3801d3215cd8ff19cb10fd9a93' recovered/*part-00 '9befa3b8e057959930b0256239bb3a1855802a79b425b98c4f92a8d18187c84d' recovered/*part-01 '04b19c2b54895a472a7b09e74bf6db54ccc1e4c17547443e311815555e32b713' recovered/*archive-checksums.txt | sha256sum --check
          cp recovered/*part-00 "release-source/dlME-${RELEASE_VERSION}-corresponding-source-ffmpeg.tar.part-00"
          cp recovered/*part-01 "release-source/dlME-${RELEASE_VERSION}-corresponding-source-ffmpeg.tar.part-01"
          cp recovered/*archive-checksums.txt "release-source/dlME-${RELEASE_VERSION}-ffmpeg-source-archive-checksums.txt"
          (cd release-source && sha256sum * > "dlME-${RELEASE_VERSION}-corresponding-source-part-checksums.txt")
          cat > "release-source/dlME-${RELEASE_VERSION}-corresponding-source-README.txt" <<EOF
          dlME ${RELEASE_VERSION} corresponding source: pinned FFmpeg dependency cache

          Download both numbered .tar.part-* files and verify the part-checksums inventory.
          Linux/macOS: cat dlME-${RELEASE_VERSION}-corresponding-source-ffmpeg.tar.part-* > ffmpeg-dependency-sources.tar
          PowerShell: use binary FileStreams to append part-00 followed by part-01 into ffmpeg-dependency-sources.tar.
          Extract the resulting tar and verify the nested ffmpeg-dependency-source-checksums.txt inventory.

          This is the unchanged source cache assembled by successful audit run 34488165224
          using yt-dlp/FFmpeg-Builds commit ea2ec3c0e0dfb11069729b7df5cb234bb2145956.
          Recovery from ${SOURCE_TAG} is verified against three SHA-256 pins in the workflow.
          EOF
      - name: Publish dependency-source parts to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: gh release upload "v${RELEASE_VERSION}" release-source/* --repo YazeKT/dlME --clobber
      - name: Verify uploaded source assets by downloading them again
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          mkdir uploaded-verification
          gh release download "v${RELEASE_VERSION}" --repo YazeKT/dlME --dir uploaded-verification --pattern '*ffmpeg.tar.part-*' --pattern '*ffmpeg-source-archive-checksums.txt'
          cp release-source/*part-checksums.txt uploaded-verification/checksums.txt
          sed -i 's|release-source/||g' uploaded-verification/checksums.txt
          (cd uploaded-verification && sha256sum --check checksums.txt)
