name: Publish corresponding-source dependency cache

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful FFmpeg source-audit workflow run ID
        required: true
        default: '34488165224'

permissions:
  actions: read
  contents: write

jobs:
  publish-source-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download the audited dependency-source artifact
        uses: actions/download-artifact@v5
        with:
          name: ffmpeg-dependency-sources-2026-08-31
          path: audited-source
          repository: YazeKT/dlME
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare release-sized source parts
        run: |
          test -s audited-source/ffmpeg-dependency-sources.tar
          test -s audited-source/ffmpeg-dependency-source-checksums.txt
          mkdir release-source
          cp audited-source/ffmpeg-dependency-source-checksums.txt release-source/dlME-0.9.0-ffmpeg-source-archive-checksums.txt
          split -b 1800m -d -a 2 audited-source/ffmpeg-dependency-sources.tar release-source/dlME-0.9.0-corresponding-source-ffmpeg.tar.part-
          sha256sum release-source/* > release-source/dlME-0.9.0-corresponding-source-part-checksums.txt
          cat > release-source/dlME-0.9.0-corresponding-source-README.txt <<'EOF'
          dlME 0.9.0 corresponding source: FFmpeg dependency cache

          Download every .tar.part-* file, then reconstruct the source archive:
            Linux/macOS: cat dlME-0.9.0-corresponding-source-ffmpeg.tar.part-* > ffmpeg-dependency-sources.tar
            PowerShell:  Get-Content dlME-0.9.0-corresponding-source-ffmpeg.tar.part-* -AsByteStream | Set-Content ffmpeg-dependency-sources.tar -AsByteStream

          Verify each downloaded part with dlME-0.9.0-corresponding-source-part-checksums.txt.
          The reconstructed tar contains the full source cache generated by download.sh from
          yt-dlp/FFmpeg-Builds commit ea2ec3c0e0dfb11069729b7df5cb234bb2145956.
          EOF
      - name: Publish dependency-source parts to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload v0.9.0 release-source/* --repo YazeKT/dlME --clobber
